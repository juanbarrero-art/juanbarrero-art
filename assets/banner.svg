<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Banner con medusa ASCII de colores y terminal, de Juan Barrero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060b"/>
      <stop offset="55%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="45%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jelly" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="56"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#22d3ee" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <circle cx="960" cy="140" r="190" fill="#6366f1" fill-opacity="0.20" filter="url(#soft)"/>
  <circle cx="300" cy="440" r="170" fill="#22d3ee" fill-opacity="0.14" filter="url(#soft)"/>

  <!-- Lluvia de codigo -->
  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#22d3ee" fill-opacity="0.12">
    <text x="16" y="40">0110</text>
    <text x="16" y="120">1010</text>
    <text x="16" y="200">0xA3</text>
    <text x="16" y="280">1101</text>
    <text x="16" y="360">0011</text>
    <text x="16" y="440">x86</text>
    <text x="1146" y="60">0xF1</text>
    <text x="1150" y="150">PE</text>
    <text x="1146" y="240">0110</text>
    <text x="1150" y="330">SIG</text>
    <text x="1146" y="420">ntdll</text>
  </g>

  <!-- Nombre + glitch -->
  <g filter="url(#glow)">
    <text x="66" y="118" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="54" font-weight="700" fill="url(#title)">Juan Barrero</text>
  </g>
  <text x="70" y="122" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="54" font-weight="700" fill="#22d3ee" fill-opacity="0.18">Juan Barrero</text>
  <text x="63" y="115" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="54" font-weight="700" fill="#8b5cf6" fill-opacity="0.20">Juan Barrero</text>

  <text x="68" y="156" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="19" fill="#c7d2fe">Aprendiendo a romper para defender</text>
  <text x="68" y="182" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#8b93b8">Learning to break so I can defend</text>

  <!-- Ventana de terminal -->
  <g>
    <rect x="62" y="214" width="560" height="222" rx="12" fill="#05070d" fill-opacity="0.92" stroke="#22d3ee" stroke-opacity="0.35"/>
    <rect x="62" y="214" width="560" height="32" rx="12" fill="#0b1220"/>
    <rect x="62" y="236" width="560" height="10" fill="#0b1220"/>
    <circle cx="88" cy="230" r="6" fill="#f87171"/>
    <circle cx="110" cy="230" r="6" fill="#fbbf24"/>
    <circle cx="132" cy="230" r="6" fill="#34d399"/>
    <text x="152" y="235" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="12" fill="#64748b">juan@cyber: ~/profile</text>

    <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14">
      <text x="84" y="278" fill="#22c55e">juan@cyber:~$</text>
      <text x="222" y="278" fill="#e5e7eb">./recon.sh --target me</text>
      <text x="84" y="304" fill="#94a3b8">[+] role  : Cybersecurity Student</text>
      <text x="84" y="328" fill="#94a3b8">[+] focus : </text>
      <text x="178" y="328" fill="#a78bfa">Malware Analysis</text>
      <text x="316" y="328" fill="#94a3b8">&amp;</text>
      <text x="334" y="328" fill="#a78bfa">Windows Internals</text>
      <text x="84" y="352" fill="#94a3b8">[+] team  : </text>
      <text x="178" y="352" fill="#7dd3fc">Blue Team</text>
      <text x="274" y="352" fill="#94a3b8">(base</text>
      <text x="322" y="352" fill="#8b5cf6">Red Team</text>
      <text x="406" y="352" fill="#94a3b8">)</text>
      <text x="84" y="376" fill="#94a3b8">[+] os    : Lubuntu</text>
      <text x="84" y="400" fill="#22c55e">juan@cyber:~$</text>
      <text x="222" y="400" fill="#7dd3fc">cat about.txt</text>
      <text x="84" y="424" fill="#64748b">Entender el sistema a bajo nivel para defenderlo mejor.</text>
    </g>
  </g>

  <!-- Medusa ASCII (bioluminiscente, en color) -->
  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" filter="url(#jelly)" xml:space="preserve">
    <!-- Campana -->
    <text fill="url(#bell)">
      <tspan x="756" y="86">                 .-~~~~~~~~-.</tspan>
      <tspan x="756" dy="13">             .-'              '-.</tspan>
      <tspan x="756" dy="13">           .'     .-~~~~~~-.     '.</tspan>
      <tspan x="756" dy="13">          /      /  o    o  \      \</tspan>
      <tspan x="756" dy="13">         /      |  o  /\  o  |      \</tspan>
      <tspan x="756" dy="13">        |       |    /  \    |       |</tspan>
      <tspan x="756" dy="13">        |       |   |    |   |       |</tspan>
      <tspan x="756" dy="13">         \       \   \  /   /       /</tspan>
      <tspan x="756" dy="13">          '.      '-.____.-'      .'</tspan>
      <tspan x="756" dy="13">            '-..______________..-'</tspan>
    </text>
    <!-- Tentaculos -->
    <text fill="url(#tent)">
      <tspan x="756" dy="13">          /  /  /  |  \  \  \  \</tspan>
      <tspan x="756" dy="13">         /  /  /   |   \  \  \  \</tspan>
      <tspan x="756" dy="13">        /  /  /    |    \  \  \  \</tspan>
      <tspan x="756" dy="13">       |  |  |     |     |  |  |  |</tspan>
      <tspan x="756" dy="13">       |  |  |     |     |  |  |  |</tspan>
      <tspan x="756" dy="13">        \  \  \    |    /  /  /  /</tspan>
      <tspan x="756" dy="13">         \  \  \   |   /  /  /  /</tspan>
      <tspan x="756" dy="13">          \  \  \  |  /  /  /  /</tspan>
      <tspan x="756" dy="13">           \  \  \ | /  /  /  /</tspan>
      <tspan x="756" dy="13">            \  \  \|/  /  /  /</tspan>
      <tspan x="756" dy="13">             \  \  V  /  /  /</tspan>
      <tspan x="756" dy="13">              \  \   /  /  /</tspan>
      <tspan x="756" dy="13">               \  \ /  /  /</tspan>
      <tspan x="756" dy="13">                \  V  /  /</tspan>
      <tspan x="756" dy="13">                 \   /  /</tspan>
      <tspan x="756" dy="13">                  \ /  /</tspan>
      <tspan x="756" dy="13">                   V  /</tspan>
      <tspan x="756" dy="13">                    \/</tspan>
    </text>
  </g>

  <!-- Puntos bioluminiscentes -->
  <g fill="#e879f9">
    <circle cx="742" cy="120" r="2.5" fill-opacity="0.8"/>
    <circle cx="1108" cy="96" r="2" fill-opacity="0.7"/>
    <circle cx="700" cy="300" r="2" fill-opacity="0.6"/>
    <circle cx="1120" cy="360" r="2.5" fill-opacity="0.7"/>
    <circle cx="980" cy="440" r="2" fill-opacity="0.6"/>
    <circle cx="860" cy="70" r="2" fill-opacity="0.7"/>
  </g>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="13" fill="#22c55e">
    <text x="806" y="452">[ root&#64;juanbarrero ]</text>
    <text x="982" y="452" fill="#8b5cf6">[ access: granted ]</text>
  </g>
</svg>
